# Isolated Spring context: never loads config/application.yml or the production datasource.
spring.datasource.url=jdbc:h2:mem:tenant-hardening;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
tienda.setup-mode=false
tienda.catalog.tenant-code=catalog-public
