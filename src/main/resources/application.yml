server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: tienda-pos
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: America/Mexico_City
  flyway:
    enabled: true

logging:
  level:
    root: INFO
    org.springframework.security: INFO
  file:
    name: logs/tienda-pos.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14

tienda:
  setup-mode: false
  timezone: America/Mexico_City
  currency: MXN
  currency-symbol: "$"
  product-images:
    directory: ./data/products
    public-path: /uploads/products
    max-upload-size: 5MB
    max-width: 800
    max-height: 800
    webp-quality: 0.82

external:
  products:
    open-food-facts:
      enabled: true
      base-url: https://world.openfoodfacts.org
      user-agent: TiendaPOS/1.0
      connect-timeout: 3s
      read-timeout: 5s
