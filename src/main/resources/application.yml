server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: tienda-pos
  thymeleaf:
    cache: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: America/Mexico_City
  flyway:
    enabled: true

logging:
  level:
    root: INFO
    org.springframework.security: INFO
  file:
    name: logs/tienda-pos.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14

tienda:
  setup-mode: false
  timezone: America/Mexico_City
  currency: MXN
  currency-symbol: "$"
