server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax
        max-age: 12h

spring:
  application:
    name: tienda-pos
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 256MB
      max-request-size: 257MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: America/Mexico_City
  flyway:
    enabled: true

springdoc:
  api-docs:
    enabled: ${TIENDA_API_DOCS_ENABLED:true}
    path: /api-docs
  swagger-ui:
    enabled: ${TIENDA_API_DOCS_ENABLED:true}
    path: /swagger-ui
  paths-to-match: /api/v1/**

logging:
  level:
    root: INFO
    org.springframework.security: INFO
  file:
    name: logs/tienda-pos.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14

tienda:
  setup-mode: false
  timezone: America/Mexico_City
  currency: MXN
  currency-symbol: "$"
  api:
    issuer: ${TIENDA_API_ISSUER:tienda-pos}
    jwt-secret: ${TIENDA_API_JWT_SECRET:}
    access-token-ttl: ${TIENDA_API_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${TIENDA_API_REFRESH_TOKEN_TTL:30d}
    cors-allowed-origins: ${TIENDA_API_CORS_ALLOWED_ORIGINS:}
  whatsapp:
    master-key: ${TIENDA_WPPCONNECT_MASTER_KEY:}
    allowed-hosts: ${TIENDA_WPPCONNECT_ALLOWED_HOSTS:127.0.0.1,localhost}
    connect-timeout: ${TIENDA_WPPCONNECT_CONNECT_TIMEOUT:3s}
    read-timeout: ${TIENDA_WPPCONNECT_READ_TIMEOUT:12s}
    group-sync-read-timeout: ${TIENDA_WPPCONNECT_GROUP_SYNC_READ_TIMEOUT:90s}
    group-sync-page-size: ${TIENDA_WPPCONNECT_GROUP_SYNC_PAGE_SIZE:100}
    group-sync-max-pages: ${TIENDA_WPPCONNECT_GROUP_SYNC_MAX_PAGES:100}
    status-cache-ttl: ${TIENDA_WPPCONNECT_STATUS_CACHE_TTL:20s}
    max-upload-bytes: ${TIENDA_WPPCONNECT_MAX_UPLOAD_BYTES:10485760}
    monitor-delay-ms: ${TIENDA_WPPCONNECT_MONITOR_DELAY_MS:300000}
  catalog-images:
    directory: ./data/catalog
    public-path: /uploads/catalog
    max-upload-size: 5MB
    max-width: 1200
    max-height: 600
    image-quality: 0.82
  product-images:
    directory: ./data/products
    public-path: /uploads/products
    max-upload-size: 5MB
    max-width: 800
    max-height: 800
    webp-quality: 0.82

external:
  products:
    open-food-facts:
      enabled: true
      base-url: https://world.openfoodfacts.org
      user-agent: TiendaPOS/1.0
      connect-timeout: 3s
      read-timeout: 5s
