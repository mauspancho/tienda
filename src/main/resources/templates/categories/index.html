<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Categorías</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="main"><div th:replace="~{fragments/layout :: header}"></div><section class="content"><h1>Categorías</h1><div th:replace="~{fragments/layout :: alerts}"></div><div class="grid grid-2"><form class="card form" th:object="${category}" th:action="@{/categories}" method="post"><div class="field"><label>Nombre</label><input th:field="*{name}"></div><div class="field"><label>Descripción</label><input th:field="*{description}"></div><button class="btn btn-success">Guardar</button></form><div class="table-wrap"><table><tr><th>Nombre</th><th>Estado</th><th></th></tr><tr th:each="c:${categories.content}"><td th:text="${c.name}"></td><td><span th:class="${c.active ? 'badge badge-green' : 'badge badge-red'}" th:text="${c.active ? 'Activa' : 'Inactiva'}"></span></td><td><form th:action="@{'/categories/' + ${c.id} + '/toggle'}" method="post"><button class="btn btn-muted">Cambiar</button></form></td></tr></table></div></div></section></main></div></body></html>
