<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Usuarios</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="main"><div th:replace="~{fragments/layout :: header}"></div><section class="content"><h1>Usuarios</h1><div th:replace="~{fragments/layout :: alerts}"></div><div class="grid grid-2"><form class="card form" th:object="${userForm}" th:action="@{/users}" method="post"><div class="grid grid-2"><div class="field"><label>Nombre</label><input th:field="*{firstName}"></div><div class="field"><label>Apellido</label><input th:field="*{lastName}"></div></div><div class="grid grid-2"><div class="field"><label>Usuario</label><input th:field="*{username}"></div><div class="field"><label>Contraseña</label><input type="password" th:field="*{password}"></div></div><div class="field"><label>Email</label><input th:field="*{email}"></div><label><input type="checkbox" th:field="*{admin}"> Administrador</label><label><input type="checkbox" th:field="*{cashier}"> Cajero</label><button class="btn btn-success">Crear usuario</button></form><div class="table-wrap"><table><tr><th>Usuario</th><th>Nombre</th><th>Roles</th><th>Estado</th></tr><tr th:each="u:${users.content}"><td th:text="${u.username}"></td><td th:text="${u.fullName()}"></td><td th:text="${u.roles}"></td><td><span th:class="${u.active ? 'badge badge-green' : 'badge badge-red'}" th:text="${u.active ? 'Activo' : 'Inactivo'}"></span></td></tr></table></div></div></section></main></div></body></html>
