<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Producto</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="main"><div th:replace="~{fragments/layout :: header}"></div><section class="content">
<div class="page-title"><h1>Producto</h1><a class="btn btn-muted" th:href="@{/products}">Volver</a></div>
<form class="card form" th:object="${productForm}" th:action="@{/products}" method="post"><input type="hidden" th:field="*{id}">
<div class="grid grid-3"><div class="field"><label>Código</label><div class="join w-full"><input class="join-item" th:field="*{code}" data-code-target="code"><button class="btn btn-muted join-item" type="button" data-generate-code="code">Generar</button></div></div><div class="field"><label>Código barras</label><div class="join w-full"><input class="join-item" th:field="*{barcode}" data-code-target="barcode"><button class="btn btn-muted join-item" type="button" data-generate-code="barcode">Generar</button></div></div><div class="field"><label>Producto</label><input th:field="*{name}"></div></div>
<div class="field"><label>Descripción</label><textarea th:field="*{description}"></textarea></div>
<div class="grid grid-3"><div class="field"><label>Categoría</label><select th:field="*{categoryId}"><option value="">Sin categoría</option><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}"></option></select></div><div class="field"><label>Proveedor</label><select th:field="*{supplierId}"><option value="">Sin proveedor</option><option th:each="s:${suppliers}" th:value="${s.id}" th:text="${s.name}"></option></select></div><div class="field"><label>Unidad</label><select th:field="*{unit}"><option th:each="u:${units}" th:value="${u}" th:text="${u}"></option></select></div></div>
<div class="grid grid-3"><div class="field"><label>Costo</label><input type="number" step="0.01" th:field="*{purchaseCost}"></div><div class="field"><label>Precio venta</label><input type="number" step="0.01" th:field="*{salePrice}"></div><div class="field"><label>Impuesto %</label><input type="number" step="0.01" th:field="*{tax}"></div></div>
<div class="grid grid-3"><div class="field"><label>Existencia</label><input type="number" step="0.001" th:field="*{currentStock}"></div><div class="field"><label>Stock mínimo</label><input type="number" step="0.001" th:field="*{minimumStock}"></div><div class="field"><label>Activo</label><select th:field="*{active}"><option value="true">Sí</option><option value="false">No</option></select></div></div>
<button class="btn btn-success" type="submit">Guardar producto</button></form>
</section></main></div><script th:src="@{/js/product-code-generator.js}"></script></body></html>
