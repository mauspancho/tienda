<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Etiqueta código de barras</title>
  <style>
    @page { size: 50mm 25mm; margin: 0; }
    * { box-sizing: border-box; }
    html, body { width: 50mm; height: 25mm; margin: 0; padding: 0; background: #fff; color: #000; }
    body { font-family: Arial, Helvetica, sans-serif; display: flex; align-items: center; justify-content: center; }
    .label { width: 50mm; height: 25mm; padding: 2mm 3mm; overflow: hidden; text-align: center; }
    .name { font-size: 8px; font-weight: 700; line-height: 1.05; height: 9px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .barcode { width: 44mm; height: 12mm; margin: 1mm auto 0; }
    .barcode svg { display: block; width: 100%; height: 100%; fill: #000; }
    .code { font-size: 9px; line-height: 1; letter-spacing: 1px; margin-top: 1mm; }
    .product-code { font-size: 6px; line-height: 1; margin-top: .5mm; }
    @media screen {
      body { min-height: 100vh; width: 100vw; background: #f3f4f6; }
      .label { background: #fff; border: 1px dashed #94a3b8; box-shadow: 0 12px 30px rgba(15, 23, 42, .18); }
    }
  </style>
</head>
<body>
  <div class="label">
    <div class="name" th:text="${product.name}">Producto</div>
    <div class="barcode" th:utext="${barcodeSvg}"></div>
    <div class="code" th:text="${barcode}">7500000000000</div>
    <div class="product-code" th:text="${product.code}">PRD-00000000</div>
  </div>
  <script>
    window.addEventListener('load', () => setTimeout(() => window.print(), 150));
  </script>
</body>
</html>
