<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Etiquetas código de barras</title>
  <style>
    @page { size: letter; margin: 8mm; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #fff; color: #000; }
    body { font-family: Arial, Helvetica, sans-serif; }
    .sheet { display: grid; grid-template-columns: repeat(auto-fill, 50mm); grid-auto-rows: 25mm; gap: 2mm; align-content: start; justify-content: start; padding: 0; }
    .label { width: 50mm; height: 25mm; padding: 2mm 3mm; overflow: hidden; text-align: center; break-inside: avoid; page-break-inside: avoid; border: .1mm solid transparent; }
    .name { font-size: 8px; font-weight: 700; line-height: 1.05; height: 9px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .barcode { width: 44mm; height: 12mm; margin: 1mm auto 0; }
    .barcode svg { display: block; width: 100%; height: 100%; fill: #000; }
    .code { font-size: 9px; line-height: 1; letter-spacing: 1px; margin-top: 1mm; }
    .product-code { font-size: 6px; line-height: 1; margin-top: .5mm; }
    @media screen {
      body { min-height: 100vh; background: #f3f4f6; padding: 16px; }
      .sheet { width: 215.9mm; min-height: 279.4mm; margin: 0 auto; padding: 8mm; background: #fff; box-shadow: 0 18px 50px rgba(15, 23, 42, .18); }
      .label { border-color: #cbd5e1; }
    }
    @media print {
      .sheet { width: auto; min-height: auto; }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <div class="label" th:each="label:${labels}">
      <div class="name" th:text="${product.name}">Producto</div>
      <div class="barcode" th:utext="${barcodeSvg}"></div>
      <div class="code" th:text="${barcode}">7500000000000</div>
      <div class="product-code" th:text="${product.code}">PRD-00000000</div>
    </div>
  </main>
  <script>
    window.addEventListener('load', () => setTimeout(() => window.print(), 150));
  </script>
</body>
</html>
