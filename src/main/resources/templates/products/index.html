<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="main"><div th:replace="~{fragments/layout :: header}"></div><section class="content">
<div class="page-title"><h1>Productos</h1><a class="btn btn-primary" th:href="@{/admin/products/new}">Nuevo producto</a></div><div th:replace="~{fragments/layout :: alerts}"></div>
<form class="card product-filter-form" method="get" th:action="@{/admin/products}" data-product-filter-form>
  <div class="product-filter-grid">
    <div class="field product-filter-wide"><label>Búsqueda general</label><input name="q" th:value="${q}" placeholder="Código, barras, nombre, marca o categoría" autocomplete="off" data-product-filter></div>
    <div class="field"><label>Nombre</label><input name="name" th:value="${name}" placeholder="Contiene..." autocomplete="off" data-product-filter></div>
    <div class="field"><label>Marca</label><input name="brand" th:value="${brand}" placeholder="Contiene..." autocomplete="off" data-product-filter></div>
    <div class="field"><label>Categoría</label><select name="categoryId" data-product-filter><option value="">Todas</option><option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}" th:selected="${categoryId != null and categoryId == category.id}"></option></select></div>
    <div class="field"><label>Precio mínimo</label><input type="number" name="minPrice" th:value="${minPrice}" min="0" step="0.01" inputmode="decimal" placeholder="$0.00" data-product-filter></div>
    <div class="field"><label>Precio máximo</label><input type="number" name="maxPrice" th:value="${maxPrice}" min="0" step="0.01" inputmode="decimal" placeholder="Sin límite" data-product-filter></div>
    <div class="field"><label>Estado</label><select name="active" data-product-filter><option value="" th:selected="${active == null}">Todos</option><option value="true" th:selected="${active != null and active}">Activos</option><option value="false" th:selected="${active != null and !active}">Inactivos</option></select></div>
    <div class="field"><label>Promoción WhatsApp</label><select name="whatsapp" data-product-filter><option value="" th:selected="${whatsapp == null}">Todos</option><option value="true" th:selected="${whatsapp != null and whatsapp}">Seleccionados</option><option value="false" th:selected="${whatsapp != null and !whatsapp}">No seleccionados</option></select></div>
    <div class="field"><label>Ordenar por</label><select name="sort" data-product-filter><option value="name" th:selected="${sort == 'name'}">Nombre</option><option value="brand" th:selected="${sort == 'brand'}">Marca</option><option value="code" th:selected="${sort == 'code'}">Código</option><option value="salePrice" th:selected="${sort == 'salePrice'}">Precio</option><option value="purchaseCost" th:selected="${sort == 'purchaseCost'}">Costo</option><option value="currentStock" th:selected="${sort == 'currentStock'}">Stock</option></select></div>
    <div class="field"><label>Dirección</label><select name="direction" data-product-filter><option value="asc" th:selected="${direction == 'asc'}">Ascendente</option><option value="desc" th:selected="${direction == 'desc'}">Descendente</option></select></div>
  </div>
  <input type="hidden" name="page" value="0">
  <div class="product-filter-actions"><button class="btn btn-primary" type="submit">Aplicar filtros</button><a class="btn btn-muted" th:href="@{/admin/products}">Limpiar</a></div>
</form>
<div class="table-wrap" style="margin-top:16px">
  <table class="products-table">
    <tr><th>Código</th><th>Producto</th><th>Precio</th><th>Costo</th><th>Stock</th><th>Margen</th><th>Promoción WhatsApp</th><th></th></tr>
    <tr th:each="p:${products.content}">
      <td>
        <div class="flex items-center gap-2">
          <span th:text="${p.code}"></span>
          <button class="btn btn-muted btn-sm" type="button" th:if="${p.barcode != null and !#strings.isEmpty(p.barcode)}" th:data-label-url="@{/admin/products/{id}/barcode-label(id=${p.id})}" th:data-label-product="${p.name}" th:data-label-barcode="${p.barcode}" data-open-label-modal>Imprimir</button>
        </div>
      </td>
      <td><div class="product-list-product"><img class="product-thumb" th:if="${p.imageUrl != null and !#strings.isEmpty(p.imageUrl)}" th:src="${p.imageUrl}" alt="" loading="lazy"><span class="product-thumb product-thumb-placeholder" th:unless="${p.imageUrl != null and !#strings.isEmpty(p.imageUrl)}">▣</span><div><strong th:text="${p.name}"></strong><div class="product-meta"><span th:if="${p.brand != null and !#strings.isEmpty(p.brand)}" th:text="${p.brand}"></span><span th:if="${p.category != null}" th:text="${p.category.name}"></span><span th:if="${p.barcode != null and !#strings.isEmpty(p.barcode)}" th:text="${p.barcode}"></span></div></div></div></td>
      <td th:text="${@display.money(p.salePrice)}"></td>
      <td th:text="${@display.money(p.purchaseCost)}"></td>
      <td><span th:class="${p.hasLowStock() ? 'badge badge-yellow' : 'badge badge-green'}" th:text="${@display.number(p.currentStock)}"></span></td>
      <td th:text="${@display.percent(p.marginPercent())}"></td>
      <td>
        <form class="whatsapp-promotion-form" th:action="@{/admin/products/{id}/whatsapp-promotion(id=${p.id})}" method="post">
          <input type="hidden" name="q" th:value="${q}">
          <input type="hidden" name="name" th:value="${name}">
          <input type="hidden" name="brand" th:value="${brand}">
          <input type="hidden" name="categoryId" th:value="${categoryId}">
          <input type="hidden" name="minPrice" th:value="${minPrice}">
          <input type="hidden" name="maxPrice" th:value="${maxPrice}">
          <input type="hidden" name="active" th:value="${active}">
          <input type="hidden" name="whatsapp" th:value="${whatsapp}">
          <input type="hidden" name="sort" th:value="${sort}">
          <input type="hidden" name="direction" th:value="${direction}">
          <input type="hidden" name="page" th:value="${products.number}">
          <label class="inline-flex items-center cursor-pointer whitespace-nowrap">
            <input type="checkbox" name="selected" value="true" class="sr-only peer" th:checked="${p.promocionWhatsapp}" th:attr="aria-label=|Promoción WhatsApp para ${p.name}|" data-whatsapp-promotion>
            <span class="relative w-9 h-5 bg-base-300 rounded-full peer peer-focus:ring-4 peer-focus:ring-green-300 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:start-[2px] after:bg-white after:border after:border-base-300 after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-green-600" aria-hidden="true"></span>
            <span class="select-none ms-3 text-sm font-medium text-base-content peer-checked:text-green-700" th:text="${p.promocionWhatsapp ? 'Seleccionado' : 'No seleccionado'}"></span>
          </label>
        </form>
      </td>
      <td><div class="join"><a class="btn btn-muted join-item" th:href="@{'/admin/products/' + ${p.id} + '/edit'}">Editar</a><form class="join-item" th:if="${!p.promoted}" th:action="@{/admin/products/{id}/promote(id=${p.id})}" method="post"><button class="btn btn-primary" type="submit">Promocionar</button></form><form class="join-item" th:if="${p.promoted}" th:action="@{/admin/products/{id}/unpromote(id=${p.id})}" method="post"><button class="btn btn-muted" type="submit">Quitar promoción</button></form></div><span th:if="${p.promoted}" class="badge badge-yellow mt-2">★ Promocionado</span></td>
    </tr>
    <tr th:if="${products.empty}"><td colspan="8" class="muted">No hay productos para mostrar.</td></tr>
  </table>
</div>

<div class="card" style="margin-top:16px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap" th:if="${products.totalElements > 0}" th:with="first=${products.number * products.size + 1}, last=${products.number * products.size + products.numberOfElements}">
  <span class="muted" th:text="|Mostrando ${first}-${last} de ${products.totalElements} productos|"></span>
  <div class="join" th:if="${products.totalPages > 1}" th:with="startPage=${products.number > 2 ? products.number - 2 : 0}, endPage=${products.number + 2 < products.totalPages - 1 ? products.number + 2 : products.totalPages - 1}">
    <a class="btn btn-muted join-item" th:if="${products.hasPrevious()}" th:href="@{/admin/products(q=${q},name=${name},brand=${brand},categoryId=${categoryId},minPrice=${minPrice},maxPrice=${maxPrice},active=${active},whatsapp=${whatsapp},sort=${sort},direction=${direction},page=${products.number - 1})}">Anterior</a>
    <span class="btn btn-muted join-item" th:unless="${products.hasPrevious()}">Anterior</span>
    <a class="btn btn-muted join-item" th:if="${startPage > 0}" th:href="@{/admin/products(q=${q},name=${name},brand=${brand},categoryId=${categoryId},minPrice=${minPrice},maxPrice=${maxPrice},active=${active},whatsapp=${whatsapp},sort=${sort},direction=${direction},page=0)}">1</a>
    <span class="btn btn-muted join-item" th:if="${startPage > 1}">...</span>
    <a th:each="pageNumber : ${#numbers.sequence(startPage, endPage)}" th:class="${pageNumber == products.number ? 'btn btn-primary join-item' : 'btn btn-muted join-item'}" th:href="@{/admin/products(q=${q},name=${name},brand=${brand},categoryId=${categoryId},minPrice=${minPrice},maxPrice=${maxPrice},active=${active},whatsapp=${whatsapp},sort=${sort},direction=${direction},page=${pageNumber})}" th:text="${pageNumber + 1}"></a>
    <span class="btn btn-muted join-item" th:if="${endPage < products.totalPages - 2}">...</span>
    <a class="btn btn-muted join-item" th:if="${endPage < products.totalPages - 1}" th:href="@{/admin/products(q=${q},name=${name},brand=${brand},categoryId=${categoryId},minPrice=${minPrice},maxPrice=${maxPrice},active=${active},whatsapp=${whatsapp},sort=${sort},direction=${direction},page=${products.totalPages - 1})}" th:text="${products.totalPages}"></a>
    <a class="btn btn-muted join-item" th:if="${products.hasNext()}" th:href="@{/admin/products(q=${q},name=${name},brand=${brand},categoryId=${categoryId},minPrice=${minPrice},maxPrice=${maxPrice},active=${active},whatsapp=${whatsapp},sort=${sort},direction=${direction},page=${products.number + 1})}">Siguiente</a>
    <span class="btn btn-muted join-item" th:unless="${products.hasNext()}">Siguiente</span>
  </div>
</div>

<dialog class="modal" data-label-modal>
  <div class="modal-box card form">
    <h2>Imprimir etiquetas</h2>
    <p class="muted"><strong data-label-product-name>Producto</strong><br><span data-label-product-barcode></span></p>
    <div class="field">
      <label>Cantidad de etiquetas</label>
      <input type="number" min="1" max="500" step="1" value="1" data-label-quantity>
    </div>
    <p class="muted">Se acomodarán varias etiquetas por hoja para evitar desperdiciar papel.</p>
    <div class="join">
      <button class="btn btn-success join-item" type="button" data-label-print>Imprimir</button>
      <button class="btn btn-muted join-item" type="button" data-label-cancel>Cancelar</button>
    </div>
  </div>
</dialog>
</section></main></div>
<script>
(() => {
  const filterForm = document.querySelector('[data-product-filter-form]');
  const filterControls = document.querySelectorAll('[data-product-filter]');
  let filterTimer;
  const submitFilters = () => {
    clearTimeout(filterTimer);
    if (typeof filterForm.requestSubmit === 'function') filterForm.requestSubmit();
    else filterForm.submit();
  };

  filterControls.forEach(control => {
    const eventName = control.matches('select') ? 'change' : 'input';
    control.addEventListener(eventName, () => {
      clearTimeout(filterTimer);
      if (eventName === 'change') submitFilters();
      else filterTimer = setTimeout(submitFilters, 400);
    });
  });
  filterForm?.addEventListener('submit', () => clearTimeout(filterTimer));

  document.querySelectorAll('[data-whatsapp-promotion]').forEach(input => {
    input.addEventListener('change', () => {
      input.form.setAttribute('aria-busy', 'true');
      input.form.requestSubmit();
    });
  });

  const modal = document.querySelector('[data-label-modal]');
  const quantityInput = document.querySelector('[data-label-quantity]');
  const productName = document.querySelector('[data-label-product-name]');
  const productBarcode = document.querySelector('[data-label-product-barcode]');
  let labelUrl = '';

  document.querySelectorAll('[data-open-label-modal]').forEach(button => {
    button.addEventListener('click', () => {
      labelUrl = button.dataset.labelUrl;
      productName.textContent = button.dataset.labelProduct || 'Producto';
      productBarcode.textContent = button.dataset.labelBarcode || '';
      quantityInput.value = '1';
      if (typeof modal.showModal === 'function') modal.showModal();
      else modal.setAttribute('open', 'open');
      setTimeout(() => quantityInput.focus(), 40);
    });
  });

  document.querySelector('[data-label-cancel]')?.addEventListener('click', () => modal.close());
  document.querySelector('[data-label-print]')?.addEventListener('click', () => {
    const quantity = Math.max(1, Math.min(Number(quantityInput.value || 1), 500));
    modal.close();
    window.open(`${labelUrl}?quantity=${encodeURIComponent(quantity)}`, '_blank', 'noopener');
  });

  quantityInput?.addEventListener('keydown', event => {
    if (event.key === 'Enter') {
      event.preventDefault();
      document.querySelector('[data-label-print]')?.click();
    }
  });
})();
</script>
</body></html>
