<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="main"><div th:replace="~{fragments/layout :: header}"></div><section class="content">
<div class="page-title"><h1>Productos</h1><a class="btn btn-primary" th:href="@{/products/new}">Nuevo producto</a></div><div th:replace="~{fragments/layout :: alerts}"></div>
<form class="card" method="get"><div class="field"><label>Buscar</label><input name="q" th:value="${q}" placeholder="Nombre, código o código de barras"></div></form>
<div class="table-wrap" style="margin-top:16px">
  <table>
    <tr><th>Código</th><th>Producto</th><th>Precio</th><th>Costo</th><th>Stock</th><th>Margen</th><th></th></tr>
    <tr th:each="p:${products.content}">
      <td>
        <div class="flex items-center gap-2">
          <span th:text="${p.code}"></span>
          <button class="btn btn-muted btn-sm" type="button" th:if="${p.barcode != null and !#strings.isEmpty(p.barcode)}" th:data-label-url="@{/products/{id}/barcode-label(id=${p.id})}" th:data-label-product="${p.name}" th:data-label-barcode="${p.barcode}" data-open-label-modal>Imprimir</button>
        </div>
      </td>
      <td><div class="product-list-product"><img class="product-thumb" th:if="${p.imageUrl != null and !#strings.isEmpty(p.imageUrl)}" th:src="${p.imageUrl}" alt="" loading="lazy"><span class="product-thumb product-thumb-placeholder" th:unless="${p.imageUrl != null and !#strings.isEmpty(p.imageUrl)}">▣</span><div><strong th:text="${p.name}"></strong><br><span class="muted" th:text="${p.barcode}"></span></div></div></td>
      <td th:text="${@display.money(p.salePrice)}"></td>
      <td th:text="${@display.money(p.purchaseCost)}"></td>
      <td><span th:class="${p.hasLowStock() ? 'badge badge-yellow' : 'badge badge-green'}" th:text="${@display.number(p.currentStock)}"></span></td>
      <td th:text="${@display.percent(p.marginPercent())}"></td>
      <td><a class="btn btn-muted" th:href="@{'/products/' + ${p.id} + '/edit'}">Editar</a></td>
    </tr>
  </table>
</div>

<dialog class="modal" data-label-modal>
  <div class="modal-box card form">
    <h2>Imprimir etiquetas</h2>
    <p class="muted"><strong data-label-product-name>Producto</strong><br><span data-label-product-barcode></span></p>
    <div class="field">
      <label>Cantidad de etiquetas</label>
      <input type="number" min="1" max="500" step="1" value="1" data-label-quantity>
    </div>
    <p class="muted">Se acomodarán varias etiquetas por hoja para evitar desperdiciar papel.</p>
    <div class="join">
      <button class="btn btn-success join-item" type="button" data-label-print>Imprimir</button>
      <button class="btn btn-muted join-item" type="button" data-label-cancel>Cancelar</button>
    </div>
  </div>
</dialog>
</section></main></div>
<script>
(() => {
  const modal = document.querySelector('[data-label-modal]');
  const quantityInput = document.querySelector('[data-label-quantity]');
  const productName = document.querySelector('[data-label-product-name]');
  const productBarcode = document.querySelector('[data-label-product-barcode]');
  let labelUrl = '';

  document.querySelectorAll('[data-open-label-modal]').forEach(button => {
    button.addEventListener('click', () => {
      labelUrl = button.dataset.labelUrl;
      productName.textContent = button.dataset.labelProduct || 'Producto';
      productBarcode.textContent = button.dataset.labelBarcode || '';
      quantityInput.value = '1';
      if (typeof modal.showModal === 'function') modal.showModal();
      else modal.setAttribute('open', 'open');
      setTimeout(() => quantityInput.focus(), 40);
    });
  });

  document.querySelector('[data-label-cancel]')?.addEventListener('click', () => modal.close());
  document.querySelector('[data-label-print]')?.addEventListener('click', () => {
    const quantity = Math.max(1, Math.min(Number(quantityInput.value || 1), 500));
    modal.close();
    window.open(`${labelUrl}?quantity=${encodeURIComponent(quantity)}`, '_blank', 'noopener');
  });

  quantityInput?.addEventListener('keydown', event => {
    if (event.key === 'Enter') {
      event.preventDefault();
      document.querySelector('[data-label-print]')?.click();
    }
  });
})();
</script>
</body></html>
