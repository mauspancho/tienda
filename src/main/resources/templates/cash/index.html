<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Caja</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="main"><div th:replace="~{fragments/layout :: header}"></div><section class="content"><h1>Caja</h1><div th:replace="~{fragments/layout :: alerts}"></div><div class="grid grid-2"><form class="card form" th:action="@{/cash/open}" method="post"><h2>Apertura</h2><div class="field"><label>Fondo inicial</label><input name="openingAmount" type="number" step="0.01" value="0"></div><button class="btn btn-success">Abrir caja</button></form><form class="card form" th:action="@{/cash/close}" method="post"><h2>Cierre</h2><div class="field"><label>Sesión</label><select name="sessionId"><option th:each="s:${sessions.content}" th:if="${s.open}" th:value="${s.id}" th:text="${'#' + s.id + ' - ' + s.cashier.username}"></option></select></div><div class="field"><label>Contado</label><input name="countedAmount" type="number" step="0.01" value="0"></div><button class="btn btn-primary">Cerrar caja</button></form></div><div class="table-wrap" style="margin-top:16px"><table><tr><th>ID</th><th>Cajero</th><th>Apertura</th><th>Fondo</th><th>Estado</th></tr><tr th:each="s:${sessions.content}"><td th:text="${s.id}"></td><td th:text="${s.cashier != null ? s.cashier.username : ''}"></td><td th:text="${#temporals.format(s.openedAt,'dd/MM HH:mm')}"></td><td th:text="${'$' + s.openingAmount}"></td><td><span th:class="${s.open ? 'badge badge-green' : 'badge badge-red'}" th:text="${s.open ? 'Abierta' : 'Cerrada'}"></span></td></tr></table></div></section></main></div></body></html>
