<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" data-theme="sunset">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page" data-theme="sunset">
<main class="login-card">
  <div class="brand login-brand"><span class="brand-mark">TP</span><span>Tienda POS</span></div>
  <h1>Iniciar sesión</h1>
  <div th:switch="${param.expired != null ? 'expired' : param.suspended != null ? 'suspended' : param.error != null ? 'error' : param.sessionExpired != null ? 'sessionExpired' : param.logout != null ? 'logout' : ''}">
    <p th:case="'expired'" class="alert alert-error" role="alert">Tu sesión fue cerrada porque tu cuenta o tienda fue suspendida.</p>
    <p th:case="'suspended'" class="alert alert-error" role="alert">Tu cuenta o tienda está suspendida. Contacta al administrador.</p>
    <p th:case="'error'" class="alert alert-error" role="alert">Usuario o contraseña incorrectos.</p>
    <p th:case="'sessionExpired'" class="alert alert-error" role="alert">Tu sesión terminó. Inicia sesión nuevamente.</p>
    <p th:case="'logout'" class="alert alert-success" role="status">Sesión cerrada correctamente.</p>
  </div>
  <form class="form" th:action="@{/admin/login}" method="post">
    <div class="field"><label>Usuario</label><input name="username" autofocus autocomplete="username"></div>
    <div class="field"><label>Contraseña</label><input name="password" type="password" autocomplete="current-password"></div>
    <button class="btn btn-primary" type="submit">Iniciar sesión</button>
  </form>
</main>
</body>
</html>
