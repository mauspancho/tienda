<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventario</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <main class="main">
    <div th:replace="~{fragments/layout :: header}"></div>
    <section class="content">
      <h1>Inventario</h1>
      <div th:replace="~{fragments/layout :: alerts}"></div>
      <div class="grid grid-2">
        <form class="card form" th:object="${adjustmentForm}" th:action="@{/admin/inventory/adjust}" method="post">
          <h2>Ajustar inventario</h2>
          <div class="field"><label>Producto</label><select th:field="*{productId}"><option th:each="p:${products}" th:value="${p.id}" th:text="${p.name}"></option></select></div>
          <div class="grid grid-3">
            <div class="field"><label>Tipo</label><select th:field="*{movementType}"><option value="ADJUSTMENT_IN">Entrada</option><option value="ADJUSTMENT_OUT">Salida</option><option value="INITIAL_STOCK">Inventario inicial</option></select></div>
            <div class="field"><label>Cantidad</label><input type="number" step="0.01" th:field="*{quantity}"></div>
            <div class="field"><label>Costo unitario</label><input type="number" step="0.01" min="0" th:field="*{unitCost}" placeholder="0.00"></div>
          </div>
          <div class="field"><label>Motivo / notas</label><input th:field="*{notes}" placeholder="Merma, producto vencido, error conteo"></div>
          <button class="btn btn-success">Actualizar inventario</button>
        </form>
        <div class="table-wrap">
          <table>
            <tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cantidad</th><th>Nuevo</th><th>Costo aplicado</th><th>Costo nuevo</th><th>Ajuste costo</th></tr>
            <tr th:each="m:${movements.content}">
              <td th:text="${#temporals.format(m.createdAt,'dd/MM HH:mm')}"></td>
              <td th:text="${m.product.name}"></td>
              <td th:text="${m.movementType}"></td>
              <td th:text="${@display.number(m.quantity)}"></td>
              <td th:text="${@display.number(m.newStock)}"></td>
              <td th:text="${m.unitCost != null ? @display.money(m.unitCost) : '-'}"></td>
              <td th:text="${m.newPurchaseCost != null ? @display.money(m.newPurchaseCost) : '-'}"></td>
              <td th:text="${m.costAdjustment != null ? @display.money(m.costAdjustment) : '-'}"></td>
            </tr>
          </table>
        </div>
      </div>
    </section>
  </main>
</div>
</body>
</html>
