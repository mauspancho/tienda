<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gastos</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="main"><div th:replace="~{fragments/layout :: header}"></div><section class="content"><h1>Gastos</h1><div th:replace="~{fragments/layout :: alerts}"></div><div class="grid grid-2"><form class="card form" th:action="@{/expenses}" method="post"><div class="field"><label>Concepto</label><input name="concept" required></div><div class="field"><label>Categoría</label><select name="categoryId"><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}"></option></select></div><div class="grid grid-2"><div class="field"><label>Monto</label><input name="amount" type="number" step="0.01" required></div><div class="field"><label>Fecha</label><input name="expenseDate" type="date" required></div></div><div class="field"><label>Notas</label><input name="notes"></div><button class="btn btn-success">Registrar gasto</button></form><div class="table-wrap"><table><tr><th>Fecha</th><th>Concepto</th><th>Monto</th></tr><tr th:each="e:${expenses.content}"><td th:text="${e.expenseDate}"></td><td th:text="${e.concept}"></td><td th:text="${@display.money(e.amount)}"></td></tr></table></div></div></section></main></div></body></html>
