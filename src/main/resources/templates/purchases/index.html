<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Compras</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="main"><div th:replace="~{fragments/layout :: header}"></div><section class="content"><h1>Compras</h1><div th:replace="~{fragments/layout :: alerts}"></div><div class="grid grid-2"><form class="card form" th:object="${purchaseForm}" th:action="@{/purchases}" method="post"><div class="field"><label>Proveedor</label><select th:field="*{supplierId}"><option th:each="s:${suppliers}" th:value="${s.id}" th:text="${s.name}"></option></select></div><div class="field"><label>Folio externo</label><input th:field="*{externalFolio}"></div><div class="field"><label>Producto</label><select th:field="*{productId}"><option th:each="p:${products}" th:value="${p.id}" th:text="${p.name}"></option></select></div><div class="grid grid-2"><div class="field"><label>Cantidad</label><input type="number" step="0.001" th:field="*{quantity}"></div><div class="field"><label>Costo unitario</label><input type="number" step="0.01" th:field="*{unitCost}"></div></div><div class="field"><label>Notas</label><input th:field="*{notes}"></div><button class="btn btn-success">Registrar compra</button></form><div class="table-wrap"><table><tr><th>Fecha</th><th>Proveedor</th><th>Total</th></tr><tr th:each="p:${purchases.content}"><td th:text="${p.purchaseDate}"></td><td th:text="${p.supplier != null ? p.supplier.name : ''}"></td><td th:text="${'$' + p.total}"></td></tr></table></div></div></section></main></div></body></html>
