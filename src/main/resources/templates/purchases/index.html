<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compras</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="main"><div th:replace="~{fragments/layout :: header}"></div><section class="content">
<h1>Compras</h1><div th:replace="~{fragments/layout :: alerts}"></div>
<div class="grid grid-2">
  <form class="card form" th:object="${purchaseForm}" th:action="@{/admin/purchases}" method="post" data-purchase-form>
    <div class="field"><label>Proveedor</label><select th:field="*{supplierId}"><option value="">Sin proveedor</option><option th:each="s:${suppliers}" th:value="${s.id}" th:text="${s.name}"></option></select></div>
    <div class="field"><label>Folio externo</label><input th:field="*{externalFolio}" placeholder="Se asigna automático si lo dejas vacío"></div>
    <div class="field"><label>Producto existente</label><select th:field="*{productId}" data-purchase-product><option value="">Selecciona producto</option><option th:each="p:${products}" th:value="${p.id}" th:text="${p.name + ' · ' + p.code}" th:data-cost="${@display.number(p.purchaseCost)}"></option></select></div>
    <div class="grid grid-2"><div class="field"><label>Cantidad</label><input type="number" step="0.01" th:field="*{quantity}" data-purchase-quantity></div><div class="field"><label>Costo unitario</label><input type="number" step="0.01" th:field="*{unitCost}" data-purchase-cost></div></div>
    <label><input type="checkbox" th:field="*{updateProductCost}"> Actualizar costo unitario del producto</label>
    <div class="grid grid-2"><div class="field"><label>Total compra</label><div class="cart-total" data-purchase-total>$0.00</div></div></div>
    <div class="field"><label>Notas</label><input th:field="*{notes}"></div>
    <button class="btn btn-success">Registrar compra</button>
  </form>
  <div class="table-wrap"><table><tr><th>Fecha</th><th>Folio</th><th>Proveedor</th><th>Total</th></tr><tr th:each="p:${purchases.content}"><td th:text="${p.purchaseDate}"></td><td th:text="${p.externalFolio}"></td><td th:text="${p.supplier != null ? p.supplier.name : 'Sin proveedor'}"></td><td th:text="${@display.money(p.total)}"></td></tr></table></div>
</div>
</section></main></div>
<script>
(() => {
  const productSelect = document.querySelector('[data-purchase-product]');
  const costInput = document.querySelector('[data-purchase-cost]');
  const quantityInput = document.querySelector('[data-purchase-quantity]');
  const totalEl = document.querySelector('[data-purchase-total]');
  const money = value => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(value || 0);

  function updateTotal() {
    const quantity = Number(quantityInput?.value || 0);
    const cost = Number(costInput?.value || 0);
    if (totalEl) totalEl.textContent = money(quantity * cost);
  }

  productSelect?.addEventListener('change', () => {
    const selected = productSelect.selectedOptions[0];
    const cost = selected?.dataset.cost;
    if (cost && costInput && !Number(costInput.value || 0)) {
      costInput.value = Number(String(cost).replace(/,/g, '')).toFixed(2);
    }
    updateTotal();
  });
  costInput?.addEventListener('input', updateTotal);
  quantityInput?.addEventListener('input', updateTotal);
  updateTotal();
})();
</script>
</body></html>
