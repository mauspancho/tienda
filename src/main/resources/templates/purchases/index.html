<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compras</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="main"><div th:replace="~{fragments/layout :: header}"></div><section class="content">
<h1>Compras</h1><div th:replace="~{fragments/layout :: alerts}"></div>
<div class="grid grid-2">
  <form class="card form" th:object="${purchaseForm}" th:action="@{/admin/purchases}" method="post" data-purchase-form>
    <div class="field"><label>Proveedor</label><select th:field="*{supplierId}"><option value="">Sin proveedor</option><option th:each="s:${suppliers}" th:value="${s.id}" th:text="${s.name}"></option></select></div>
    <div class="field"><label>Folio externo</label><input th:field="*{externalFolio}" placeholder="Se asigna automático si lo dejas vacío"></div>
    <div class="field"><label>Origen del dinero</label><select th:field="*{fundingSource}"><option th:each="source:${fundingSources}" th:value="${source}" th:text="${source.label}"></option></select></div>
    <div class="field">
      <label for="purchaseProductSearch">Producto existente</label>
      <div class="product-autocomplete" data-purchase-product-autocomplete>
        <input id="purchaseProductSearch" type="search" autocomplete="off" placeholder="Escribe nombre, marca, código o código de barras" data-purchase-product-search role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="purchaseProductMatches">
        <input type="hidden" th:field="*{productId}" data-purchase-product>
        <div id="purchaseProductMatches" class="product-autocomplete-menu purchase-product-menu" data-purchase-product-menu role="listbox" hidden></div>
      </div>
    </div>
    <div class="grid grid-2"><div class="field"><label>Cantidad</label><input type="number" step="0.01" th:field="*{quantity}" data-purchase-quantity></div><div class="field"><label>Costo unitario</label><input type="number" step="0.01" th:field="*{unitCost}" data-purchase-cost></div></div>
    <label><input type="checkbox" th:field="*{updateProductCost}"> Actualizar costo unitario del producto</label>
    <div class="grid grid-2"><div class="field"><label>Total compra</label><div class="cart-total" data-purchase-total>$0.00</div></div></div>
    <div class="field"><label>Notas</label><input th:field="*{notes}"></div>
    <button class="btn btn-success">Registrar compra</button>
  </form>
  <div class="table-wrap"><table><tr><th>Fecha</th><th>Folio</th><th>Proveedor</th><th>Origen</th><th>Total</th></tr><tr th:each="p:${purchases.content}"><td th:text="${p.purchaseDate}"></td><td th:text="${p.externalFolio}"></td><td th:text="${p.supplier != null ? p.supplier.name : 'Sin proveedor'}"></td><td th:text="${p.fundingSource != null ? p.fundingSource.label : 'Sin clasificar'}"></td><td th:text="${@display.money(p.total)}"></td></tr></table></div>
</div>
</section></main></div>
<div hidden data-purchase-product-catalog>
  <span th:each="p:${products}"
        data-purchase-product-option
        th:data-id="${p.id}"
        th:data-name="${p.name}"
        th:data-brand="${p.brand}"
        th:data-code="${p.code}"
        th:data-barcode="${p.barcode}"
        th:data-presentation="${p.presentation}"
        th:data-cost="${p.purchaseCost}"></span>
</div>
<script th:src="@{/js/purchase-form.js}"></script>
</body></html>
