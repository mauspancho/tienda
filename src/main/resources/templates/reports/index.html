<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reportes</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="main"><div th:replace="~{fragments/layout :: header}"></div><section class="content"><div class="page-title"><h1>Reportes</h1><form><select name="period" onchange="this.form.submit()"><option value="TODAY">Hoy</option><option value="YESTERDAY">Ayer</option><option value="WEEK">Esta semana</option><option value="MONTH">Este mes</option></select></form></div><div class="grid grid-3"><div class="card"><span class="muted">Ventas</span><div class="metric" th:text="${@display.money(sales)}"></div></div><div class="card"><span class="muted">Ganancia bruta</span><div class="metric" th:text="${@display.money(profit)}"></div></div><div class="card"><span class="muted">Resultado estimado</span><div class="metric" th:text="${@display.money(result)}"></div></div></div><div class="grid grid-2" style="margin-top:16px"><div class="card"><h2>Inventario valorizado</h2><div class="metric" th:text="${@display.money(inventoryValue)}"></div></div><div class="table-wrap"><table><tr><th>Producto</th><th>Cantidad</th><th>Ventas</th><th>Ganancia</th></tr><tr th:each="r:${topProducts}"><td th:text="${r[0]}"></td><td th:text="${@display.number(r[1])}"></td><td th:text="${@display.money(r[2])}"></td><td th:text="${@display.money(r[3])}"></td></tr></table></div></div></section></main></div></body></html>
