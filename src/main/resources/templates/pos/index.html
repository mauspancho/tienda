<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:content="${_csrf.token}"><meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title>Punto de Venta</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="main"><div th:replace="~{fragments/layout :: header}"></div><section class="content">
<div class="page-title"><h1>Punto de Venta</h1></div>
<div th:replace="~{fragments/layout :: alerts}"></div>
<div class="pos-layout">
  <div class="grid">
    <div class="card form" th:if="${!cashOpen}">
      <h2>Caja cerrada</h2>
      <p class="muted">Abre la caja para habilitar las ventas.</p>
      <form class="form" th:action="@{/admin/pos/cash/open}" method="post">
        <div class="field"><label>Fondo inicial</label><input name="openingAmount" type="number" step="0.01" value="0.00"></div>
        <button class="btn btn-success" type="submit">Abrir caja</button>
      </form>
    </div>
    <div class="card">
      <label>Escanear código de barras / buscar producto</label>
            <div class="camera-input-row pos-camera-input-row">
        <input class="scanner-input" data-barcode-input autocomplete="off" placeholder="Escanea el código y se agrega automático" th:disabled="${!cashOpen}">
        <button class="btn btn-primary" type="button" data-camera-scan data-camera-mode="continuous" data-camera-title="Escanear venta" th:disabled="${!cashOpen}">Usar cámara</button>
      </div>
      <div data-search-results class="search-results"></div>
    </div>
    <div class="table-wrap"><table><thead><tr><th>Producto</th><th>Cant.</th><th>Precio</th><th>Total</th><th></th></tr></thead><tbody data-cart-body></tbody></table></div>
  </div>
  <aside class="card form" th:data-cash-open="${cashOpen}">
    <div th:if="${cashOpen}" data-pos-message class="alert alert-success">Caja abierta. Listo para vender.</div>
    <div th:if="${!cashOpen}" data-pos-message class="alert alert-error">Caja cerrada. Abre la caja antes de vender.</div>
    <div th:if="${cashOpen}" class="form" style="border:1px solid var(--line);border-radius:8px;padding:12px">
      <h2>Caja activa</h2>
      <p class="muted">Sesión <strong th:text="${'#' + currentCashSession.id}"></strong><br>Fondo <strong th:text="${@display.money(currentCashSession.openingAmount)}"></strong></p>
      <form class="form" th:action="@{/admin/pos/cash/close}" method="post">
        <input type="hidden" name="sessionId" th:value="${currentCashSession.id}">
        <div class="field"><label>Monto contado</label><input name="countedAmount" type="number" step="0.01" value="0.00"></div>
        <button class="btn btn-muted" type="submit">Cerrar caja</button>
      </form>
    </div>
    <div class="field"><label>Descuento</label><input data-discount type="number" step="0.01" value="0.00" th:disabled="${!cashOpen}"></div>
    <div class="field"><label>Total</label><div data-cart-total class="cart-total">$0.00</div></div>
    <div class="grid grid-3">
      <label><input type="radio" name="paymentMethod" value="CASH" checked th:disabled="${!cashOpen}"> Efectivo</label>
      <label><input type="radio" name="paymentMethod" value="CARD" th:disabled="${!cashOpen}"> Tarjeta</label>
      <label><input type="radio" name="paymentMethod" value="TRANSFER" th:disabled="${!cashOpen}"> Transferencia</label>
    </div>
    <button data-checkout class="btn btn-success" type="button" th:disabled="${!cashOpen}">Cobrar</button>
  </aside>
</div>
</section></main></div>
<script th:src="@{/vendor/zxing/zxing-browser.min.js}"></script>
<script th:src="@{/js/barcode-scanner.js}"></script>
<script th:src="@{/js/camera-barcode-scanner.js}"></script>
</body></html>
