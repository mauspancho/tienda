<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Proveedores</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="main"><div th:replace="~{fragments/layout :: header}"></div><section class="content"><h1>Proveedores</h1><div th:replace="~{fragments/layout :: alerts}"></div><div class="grid grid-2"><form class="card form" th:object="${supplier}" th:action="@{/suppliers}" method="post"><div class="grid grid-2"><div class="field"><label>Nombre</label><input th:field="*{name}"></div><div class="field"><label>Empresa</label><input th:field="*{companyName}"></div></div><div class="grid grid-2"><div class="field"><label>Teléfono</label><input th:field="*{phone}"></div><div class="field"><label>Email</label><input th:field="*{email}"></div></div><div class="field"><label>Dirección</label><input th:field="*{address}"></div><button class="btn btn-success">Guardar proveedor</button></form><div class="table-wrap"><table><tr><th>Nombre</th><th>Empresa</th><th>Teléfono</th></tr><tr th:each="s:${suppliers.content}"><td th:text="${s.name}"></td><td th:text="${s.companyName}"></td><td th:text="${s.phone}"></td></tr></table></div></div></section></main></div></body></html>
