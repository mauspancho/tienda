<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ticket</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="no-print" style="padding:16px;text-align:center"><button class="btn btn-primary" onclick="window.print()">Imprimir ticket</button></div><main class="ticket"><h2 style="text-align:center">Tienda POS</h2><p>Folio: <span th:text="${sale.folio}"></span><br>Fecha: <span th:text="${#temporals.format(sale.saleDate,'dd/MM/yyyy HH:mm')}"></span><br>Cajero: <span th:text="${sale.cashier != null ? sale.cashier.username : ''}"></span></p><hr><table><tr th:each="i:${sale.items}"><td th:text="${i.productNameSnapshot + ' x ' + @display.number(i.quantity)}"></td><td style="text-align:right" th:text="${@display.money(i.subtotal)}"></td></tr></table><hr><p>Subtotal: <span style="float:right" th:text="${@display.money(sale.subtotal)}"></span><br>Descuento: <span style="float:right" th:text="${@display.money(sale.discount)}"></span><br><strong>Total: <span style="float:right" th:text="${@display.money(sale.total)}"></span></strong><br>Pago: <span th:text="${sale.payment.method}"></span><br>Recibido: <span style="float:right" th:text="${@display.money(sale.payment.receivedAmount)}"></span><br>Cambio: <span style="float:right" th:text="${@display.money(sale.payment.changeAmount)}"></span></p><p style="text-align:center">Gracias por su compra</p></main></body></html>
