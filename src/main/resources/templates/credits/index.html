<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Créditos</title><script th:src="@{/js/theme-boot.js}"></script><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="main"><div th:replace="~{fragments/layout :: header}"></div><section class="content credits-page">
<div class="page-title"><h1>Créditos</h1><div class="credit-actions"><a class="btn btn-success" th:href="@{/admin/credits/new}">Nuevo crédito</a><a sec:authorize="hasRole('ADMIN')" class="btn btn-muted" th:href="@{/admin/credits/customers/new}">Nuevo cliente</a></div></div><div th:replace="~{fragments/layout :: alerts}"></div>
<div class="grid grid-4 credit-metrics"><div class="card"><span class="muted">Pendiente de cobro</span><strong th:text="${@display.money(summary.pending)}"></strong></div><div class="card"><span class="muted">Clientes con adeudo</span><strong th:text="${summary.customersWithDebt}"></strong></div><div class="card"><span class="muted">Créditos otorgados</span><strong th:text="${@display.money(summary.totalGranted)}"></strong></div><div class="card"><span class="muted">Abonos vigentes</span><strong th:text="${@display.money(summary.totalPaid)}"></strong></div></div>
<form class="card credit-filter" method="get"><div class="field"><label>Buscar cliente</label><input name="q" th:value="${q}" placeholder="Nombre o apellido"></div><div class="field"><label>Saldo</label><select name="filter"><option value="DEBT" th:selected="${filter=='DEBT'}">Con adeudo</option><option value="WITHOUT_DEBT" th:selected="${filter=='WITHOUT_DEBT'}">Sin adeudo</option><option value="ALL" th:selected="${filter=='ALL'}">Todos</option></select></div><div class="field"><label>Orden</label><select name="sort"><option value="DEBT" th:selected="${sort=='DEBT'}">Mayor adeudo</option><option value="NAME" th:selected="${sort=='NAME'}">Nombre</option><option value="ACTIVITY" th:selected="${sort=='ACTIVITY'}">Última actividad</option></select></div><button class="btn btn-primary" type="submit">Aplicar</button></form>
<div class="table-wrap"><table><tr><th>Cliente</th><th>Teléfono</th><th>Última actividad</th><th>Prestado</th><th>Abonado</th><th>Saldo</th><th></th></tr><tr th:each="row:${customers}"><td><strong th:text="${row.customer.fullName}"></strong><br><span class="muted" th:text="${row.customer.active?'Activo':'Inactivo'}"></span></td><td th:text="${row.customer.phone?:'-'}"></td><td th:text="${row.lastActivity!=null?#temporals.format(row.lastActivity,'dd/MM/yyyy HH:mm'):'Sin movimientos'}"></td><td th:text="${@display.money(row.totalGranted)}"></td><td th:text="${@display.money(row.totalPaid)}"></td><td><span class="badge" th:classappend="${row.balance.signum()>0?' badge-orange':' badge-green'}" th:text="${@display.money(row.balance)}"></span></td><td><a class="btn btn-muted" th:href="@{'/admin/credits/customers/'+${row.customer.id}}">Estado de cuenta</a></td></tr><tr th:if="${#lists.isEmpty(customers)}"><td colspan="7" class="muted">No hay clientes que coincidan.</td></tr></table></div>
</section></main></div></body></html>
