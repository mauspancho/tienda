<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cliente</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="main"><div th:replace="~{fragments/layout :: header}"></div><section class="content"><div class="page-title"><h1 th:text="${customerId==null?'Nuevo cliente':'Editar cliente'}"></h1><a class="btn btn-muted" th:href="@{/admin/credits}">Volver</a></div><form class="card form credit-customer-form" th:object="${customerForm}" th:action="${customerId==null}?@{/admin/credits/customers}:@{'/admin/credits/customers/'+${customerId}}" method="post"><div class="grid grid-2"><div class="field"><label>Nombre *</label><input th:field="*{name}" required></div><div class="field"><label>Apellido</label><input th:field="*{lastName}"></div><div class="field"><label>Teléfono</label><input th:field="*{phone}"></div><label class="check-card"><input type="checkbox" th:field="*{active}"> Cliente activo</label></div><div class="field"><label>Notas</label><textarea th:field="*{notes}" rows="3"></textarea></div><p class="muted">Si ya existe una persona con nombre similar, verifica sus datos antes de guardar. Los nombres iguales no se fusionan automáticamente.</p><button class="btn btn-success" type="submit">Guardar cliente</button></form></section></main></div></body></html>
