<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="_csrf" th:content="${_csrf.token}"><meta name="_csrf_header" th:content="${_csrf.headerName}"><title>Nuevo crédito</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="main"><div th:replace="~{fragments/layout :: header}"></div><section class="content"><div class="page-title"><h1>Nuevo crédito</h1><a class="btn btn-muted" th:href="@{/admin/credits}">Volver</a></div><div class="pos-layout"><div class="grid"><div class="card"><label>Cantidad * código de barras / buscar producto</label><div class="camera-input-row"><input class="scanner-input" data-barcode-input autocomplete="off" placeholder="Buscar por nombre, código o código de barras"><button class="btn btn-primary" type="button" data-camera-scan data-camera-mode="continuous">Usar cámara</button></div><div data-search-results class="search-results"></div></div><div class="table-wrap"><table><tr><th>Producto</th><th>Cant.</th><th>Precio</th><th>Total</th><th></th></tr><tbody data-cart-body></tbody></table></div></div><aside class="card form" data-cash-open="true" data-credit-page="true"><div data-pos-message class="alert alert-success">Selecciona un cliente y agrega productos.</div><div class="field"><label>Cliente *</label><select data-customer-id required><option value="">Seleccionar cliente</option><option th:each="customer:${customers}" th:value="${customer.id}" th:selected="${customer.id==selectedCustomerId}" th:text="${customer.fullName}"></option></select></div><div class="field"><label>Descuento</label><input data-discount type="number" min="0" step="0.01" value="0.00"></div><div class="field"><label>Total a adeudo</label><div data-cart-total class="cart-total">$0.00</div></div><input type="radio" name="settlementType" value="CREDIT" checked hidden><input type="radio" name="paymentMethod" value="CASH" checked hidden><button data-checkout class="btn btn-success" type="button">Confirmar entrega a crédito</button></aside></div></section></main></div><script th:src="@{/vendor/zxing/zxing-browser.min.js}"></script><script th:src="@{/js/barcode-scanner.js}"></script><script th:src="@{/js/camera-barcode-scanner.js}"></script></body></html>
