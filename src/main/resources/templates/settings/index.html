<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Configuración</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="main"><div th:replace="~{fragments/layout :: header}"></div><section class="content"><h1>Configuración</h1><div th:replace="~{fragments/layout :: alerts}"></div><form class="card form" th:object="${settings}" th:action="@{/settings}" method="post"><input type="hidden" th:field="*{id}"><div class="grid grid-3"><div class="field"><label>Nombre tienda</label><input th:field="*{storeName}"></div><div class="field"><label>Moneda</label><input th:field="*{currency}"></div><div class="field"><label>Símbolo</label><input th:field="*{currencySymbol}"></div></div><div class="grid grid-3"><div class="field"><label>Zona horaria</label><input th:field="*{timezone}"></div><div class="field"><label>Teléfono</label><input th:field="*{phone}"></div><div class="field"><label>RFC</label><input th:field="*{taxId}"></div></div><div class="field"><label>Dirección</label><input th:field="*{address}"></div><label><input type="checkbox" th:field="*{negativeStockAllowed}"> Permitir stock negativo</label><button class="btn btn-success">Guardar configuración</button></form><form style="margin-top:16px" th:action="@{/settings/backup}" method="post"><button class="btn btn-muted">Generar respaldo</button></form></section></main></div></body></html>
