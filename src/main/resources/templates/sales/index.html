<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ventas</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="main"><div th:replace="~{fragments/layout :: header}"></div><section class="content"><h1>Ventas</h1><div class="table-wrap"><table><tr><th>Folio</th><th>Fecha</th><th>Cajero</th><th>Total</th><th>Pago</th><th>Estado</th></tr><tr th:each="s:${sales.content}"><td><a th:href="@{'/sales/' + ${s.folio}}" th:text="${s.folio}"></a></td><td th:text="${#temporals.format(s.saleDate,'dd/MM/yyyy HH:mm')}"></td><td th:text="${s.cashier != null ? s.cashier.username : ''}"></td><td th:text="${'$' + s.total}"></td><td th:text="${s.payment != null ? s.payment.method : ''}"></td><td><span class="badge badge-green" th:text="${s.status}"></span></td></tr></table></div></section></main></div></body></html>
