<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Venta</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><div th:replace="~{fragments/layout :: sidebar}"></div><main class="main"><div th:replace="~{fragments/layout :: header}"></div><section class="content"><div class="page-title"><h1 th:text="${'Venta ' + sale.folio}"></h1><a class="btn btn-primary" th:href="@{'/tickets/' + ${sale.folio}}" target="_blank">Reimprimir ticket</a></div><div class="card"><p><strong>Fecha:</strong> <span th:text="${#temporals.format(sale.saleDate,'dd/MM/yyyy HH:mm')}"></span></p><p><strong>Total:</strong> <span th:text="${@display.money(sale.total)}"></span></p><p><strong>Pago:</strong> <span th:text="${sale.payment.method}"></span></p></div><div class="table-wrap" style="margin-top:16px"><table><tr><th>Producto</th><th>Cant.</th><th>Precio</th><th>Costo</th><th>Ganancia</th><th>Subtotal</th></tr><tr th:each="i:${sale.items}"><td th:text="${i.productNameSnapshot}"></td><td th:text="${@display.number(i.quantity)}"></td><td th:text="${@display.money(i.unitPrice)}"></td><td th:text="${@display.money(i.unitCost)}"></td><td th:text="${@display.money(i.profit)}"></td><td th:text="${@display.money(i.subtotal)}"></td></tr></table></div></section></main></div></body></html>
